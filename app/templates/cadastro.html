    <script>
        function validaCampo() {
            if (document.cadastro.email.value == "" || document.cadastro.email.value.length < 3) {
                alert("Volte para o campo E-mail e preencha este corretamente!");
                document.cadastro.email.focus();
                return false;
            }
            if (document.cadastro.senha.value == "" || document.cadastro.senha.value.length < 3) {
                alert("Volte para o campo Senha e preencha este corretamente!");
                document.cadastro.senha.focus();
                return false;
            }
            if (document.cadastro.endereco.value == "" || document.cadastro.endereco.value.length < 3) {
                alert("Volte para o campo Endereço e preencha este corretamente!");
                document.cadastro.endereco.focus();
                return false;
            }
            if (document.cadastro.cpf.value == "" || document.cadastro.cpf.value.length < 3) {
                alert("Volte para o campo CPF e preencha este corretamente!");
                document.cadastro.cpf.focus();
                return false;
            }
            if (document.cadastro.cidade.value == "" || document.cadastro.cidade.value.length < 3) {
                alert("Volte para o campo Cidade e preencha este corretamente!");
                document.cadastro.cidade.focus();
                return false;
            }
            if (document.cadastro.estado.value == "" || document.cadastro.estado.value.length < 3) {
                alert("Volte para o campo Estado e preencha este corretamente!");
                document.cadastro.estado.focus();
                return false;
            }
            if (document.cadastro.cep.value == "" || document.cadastro.cep.value.length < 3) {
                alert("Volte para o campo CEP e preencha este corretamente!");
                document.cadastro.cep.focus();
                return false;
            }
            if (document.cadastro.termos.checked == false) {
                alert("Selecione a caixa de termos e políticas!");
                document.cadastro.termos;
                return false;
            }

            if (!validaCPF(document.cadastro.cpf.value)) {
                alert("CPF invalido!");
                document.cadastro.cpf.focus();

            }

            if (validaCPF) {
                alert("CPF valido!");
            }

            alert("Cadastro realizado com sucesso!");
        }


        function validaCPF(cpf) {
            var Soma = 0
            var Resto

            var strCPF = String(cpf).replace(/[^\d]/g, '')

            if (strCPF.length !== 11)
                return false

            if ([
                '00000000000',
                '11111111111',
                '22222222222',
                '33333333333',
                '44444444444',
                '55555555555',
                '66666666666',
                '77777777777',
                '88888888888',
                '99999999999',
            ].indexOf(strCPF) !== -1)
                return false


            for (i = 1; i <= 9; i++)
                Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (11 - i);

            Resto = (Soma * 10) % 11

            if ((Resto == 10) || (Resto == 11))
                Resto = 0

            if (Resto != parseInt(strCPF.substring(9, 10)))
                return false

            Soma = 0

            for (i = 1; i <= 10; i++)
                Soma = Soma + parseInt(strCPF.substring(i - 1, i)) * (12 - i)

            Resto = (Soma * 10) % 11

            if ((Resto == 10) || (Resto == 11))
                Resto = 0

            if (Resto != parseInt(strCPF.substring(10, 11)))
                return false

            return true
        }
    </script>

    <main>
        <fieldset>
            <h1>CADASTRE-SE</h1>
            <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
            <script>
                $("h1").hover(
                    function () {
                        $(this).css({
                            "color": "dimgray",
                            "font-size": "50px"
                        });
                    },
                    function () {
                        $(this).css({
                            "color": "black",
                            "font-size": "32px"
                        });
                    }
                );
            </script>
            <form class="row g-3" name="cadastro" onsubmit="return validaCampo()">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" required>
                </div>
                <div class="col-4">
                    <label for="cep" class="form-label">Telefone</label>
                    <input type="text" class="form-control" id="telefone" maxlength="15" name="telefone"
                        placeholder="(99) 99999-9999" required>
                </div>
                <div class="col-6">
                    <label for="endereco" class="form-label">Endereço</label>
                    <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Sua rua, av., etc." required>
                </div>
                <div class="col-md-2">
                    <label for="cep" class="form-label">CEP</label>
                    <input type="text" class="form-control" id="cep" name="cep" maxlength="9" placeholder="99999-999" required>
                </div>
                </div>
                <div class="col-4">
                    <label for="cep" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" maxlength="14" name="cpf"
                        placeholder="999.999.999-99">
                </div>
                <div class="col-md-5">
                    <label for="cidade" class="form-label">Cidade</label>
                    <input type="text" class="form-control" id="cidade" name="cidade" required>
                </div>
                <div class="col-md-3">
                    <label for="estado" class="form-label">Estado</label>
                    <select id="estado" name="estado" class="form-select">
                        <option selected>Selecionar...</option>
                        <option>Rio Grande do Sul</option>
                        <option>Santa Catarina</option>
                        <option>Rio de Janeiro</option>
                    </select>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="termos" id="termos">
                        <label class="form-check-label" for="gridCheck">
                            Li e concordo com todos os <a class="navbar-brand" href="{{ url_for('paginas.termos_page') }}"
                                style="color: #757575">Termos e Políticas</a>
                        </label>
                    </div>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn" onclick="validaCPF(cpf)"
                        style="background-color:rgb(103, 105, 105) ; color:white">Entrar</button>
                </div>
            </form>
            <script>
                //Máscara CPF
                document.getElementById('cpf').addEventListener('input', function (e) {
                    let v = e.target.value.replace(/\D/g, '');
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d)/, '$1.$2');
                    v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                    e.target.value = v;
                });

                // Máscara Telefone
                document.getElementById('telefone').addEventListener('input', function (e) {
                    let v = e.target.value.replace(/\D/g, '');
                    v = v.replace(/(\d{2})(\d)/, '($1) $2');
                    v = v.replace(/(\d{5})(\d)/, '$1-$2');
                    e.target.value = v;
                });

                // Máscara CEP
                document.getElementById('cep').addEventListener('input', function (e) {
                    let v = e.target.value.replace(/\D/g, '');
                    v = v.replace(/(\d{5})(\d)/, '$1-$2');
                    e.target.value = v;
                });

                document.querySelector('input[name="cep"]').addEventListener('blur', function () {
                    let cep = this.value.replace(/\D/g, ''); // Remove tudo que não é número
                    if (cep.length === 8) {
                        fetch(`https://viacep.com.br/ws/${cep}/json/`)
                            .then(res => res.json())
                                .then(data => {
                                    if (!data.erro) {
                                        document.getElementById('endereco').value = data.logradouro;
                                        document.getElementById('cidade').value = data.localidade;
                                        document.getElementById('estado').value = data.estado;
                                    } else {
                                        alert("CEP não encontrado.");
                                    }
                                })
                                .catch(() => alert("Erro ao buscar CEP."));
                    }
                });
            </script>
