<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado StarWars - Criar Conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=2">
</head>
<body>
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <main class="auth-shell">
    <section class="auth-card auth-card--wide">
      <div class="text-center mb-4">
        <h1 class="auth-title">Criar conta</h1>
        <p class="auth-subtitle">Cadastre-se com os dados essenciais para começar a comprar.</p>
      </div>

      <form class="auth-form" method="post" action="{{ url_for('paginas.criar_conta_page') }}">
        {% if erro %}
        <div class="alert alert-danger" role="alert">{{ erro }}</div>
        {% endif %}
        <div class="mb-3">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome completo" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="seu@email.com" required>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>
        <div class="mb-3">
          <label for="confirmar_senha" class="form-label">Confirmar senha</label>
          <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" placeholder="Repita sua senha" required>
        </div>

        <div class="auth-actions">
          <button type="submit" class="btn btn-dark">Criar conta</button>
          <a class="auth-link" href="{{ url_for('paginas.cadastro_page') }}">Já possui conta? Entrar</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
